spring:
  application:
    name: petshop-catalog
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://postgres:5432/petshop
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus